# ─────────────────────────────────────────────────────────────────────────────
#  HCI & NLP deadlines — data file
#
#  Every conference is one entry under `conferences:`. The site re-reads this
#  file on every page load, so editing it on GitHub is all you need to update.
#
#  Fields
#    id            unique slug, used for links (e.g. chi-2027)
#    name, year    short name shown in bold ("CHI", 2027). Omit year for journals.
#    field         hci | nlp
#    full          full conference name
#    rank          CORE rank if you want it shown (A*, A, …). Leave blank if unsure.
#    place         city, country (or TBA)
#    start, end    conference dates, YYYY-MM-DD. Or use `when:` for free text.
#    link          official website
#    timezone      default AoE (UTC-12). Also accepts UTC, UTC+9, UTC-7, …
#    notification  optional, YYYY-MM-DD
#    estimated     true = dates projected from last year (shown with ≈)
#    rolling       true = no fixed deadline (submit any time)
#    note          one or two sentences shown under "All dates"
#    deadlines     list of { label, date, kind?, estimated?, timezone? }
#                  date: YYYY-MM-DD (means 23:59) or "YYYY-MM-DD HH:MM"
#                  kind: paper (default, main submission steps) or track
#                        (posters, demos, panels, workshops; hidden unless
#                        "Posters, demos and other tracks" is switched on)
# ─────────────────────────────────────────────────────────────────────────────

